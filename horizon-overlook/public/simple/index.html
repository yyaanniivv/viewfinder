<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Horizon">
  <meta name="description" content="See locations on the horizon through camera">
  <title>Horizon Overlook — Simple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Version indicator -->
  <div style="position: fixed; top: 8px; right: 8px; z-index: 9999; background: rgba(78,205,196,0.9); color: #000; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;">SIMPLE v1</div>
  <!-- Camera feed -->
  <video id="camera" autoplay playsinline muted></video>

  <!-- Canvas overlay for markers -->
  <canvas id="overlay" aria-label="Horizon markers overlay"></canvas>

  <!-- Debug pane (bottom right) -->
  <div id="debug-pane" class="debug-pane" data-state="maximized">
    <div class="debug-header">
      <h3>Debug</h3>
      <div class="debug-controls">
        <button id="minimize-debug-btn" class="control-btn" aria-label="Minimize debug pane" title="Minimize">−</button>
        <button id="maximize-debug-btn" class="control-btn" aria-label="Maximize debug pane" title="Maximize" style="display: none;">□</button>
        <button id="clear-debug-btn" class="control-btn" aria-label="Clear debug log" title="Clear">🗑</button>
      </div>
    </div>
    <div id="debug-content" class="debug-content"></div>
  </div>

  <!-- Top bar: Compass + Status + Camera Toggle -->
  <div class="top-bar">
    <button id="compass-btn" class="compass-btn" aria-label="Select location to track">
      <canvas id="compass-canvas" width="200" height="200"></canvas>
    </button>

    <div class="status-indicators">
      <div id="status-gps" class="warn">📍 GPS: —</div>
      <div id="status-compass" class="warn">🧭 Relative</div>
    </div>

    <button id="camera-toggle-btn" class="camera-toggle-btn" aria-label="Toggle camera feed" title="Toggle camera">
      📷
    </button>
  </div>

  <!-- Location Picker Overlay (triggered by compass button) -->
  <div id="location-picker-overlay" class="overlay" style="display: none;">
    <div class="picker-panel">
      <div class="picker-header">
        <h2>Select Location to Track</h2>
        <button id="picker-close-btn" class="picker-close" aria-label="Close">×</button>
      </div>
      <p class="picker-instruction">Select a location to center the AR view on it</p>

      <div class="picker-field">
        <label for="picker-location-select">Location:</label>
        <select id="picker-location-select"></select>
      </div>

      <div id="picker-selected-info" class="picker-selected-info" style="display: none;"></div>

      <div class="picker-actions">
        <button id="picker-select-btn" class="picker-btn primary">Track This Location</button>
        <button id="picker-manage-btn" class="picker-btn secondary">Manage Locations</button>
      </div>
    </div>
  </div>

  <!-- Bottom: Locations Panel -->
  <div id="locations-panel" class="panel" data-state="maximized">
    <div class="panel-header">
      <h3>Locations (<span id="location-count">0</span>)</h3>
      <div class="panel-controls">
        <button id="minimize-locations-btn" class="control-btn" aria-label="Minimize locations panel" title="Minimize">−</button>
        <button id="maximize-locations-btn" class="control-btn" aria-label="Maximize locations panel" title="Maximize" style="display: none;">□</button>
        <button id="add-location-btn" class="add-btn">+ Add</button>
      </div>
    </div>

    <div class="panel-content">
      <!-- Location Form -->
      <div id="location-form-container" class="form-container" style="display: none;">
        <form id="location-form">
          <div class="field">
            <label>Name</label>
            <input type="text" id="loc-name" placeholder="Location name" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Latitude</label>
              <input type="number" step="0.000001" id="loc-lat" placeholder="32.068444" required>
            </div>
            <div class="field">
              <label>Longitude</label>
              <input type="number" step="0.000001" id="loc-lon" placeholder="34.784437" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Altitude (m)</label>
              <input type="number" id="loc-alt" placeholder="Optional">
            </div>
            <div class="field">
              <label>Type</label>
              <select id="loc-type">
                <option value="building">Building</option>
                <option value="landmark">Landmark</option>
                <option value="poi">Point of Interest</option>
                <option value="custom">Custom</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>Color</label>
            <select id="loc-color"></select>
          </div>
          <div class="form-actions">
            <button type="button" id="loc-cancel-btn" class="cancel-btn">Cancel</button>
            <button type="submit" class="save-btn">Save</button>
          </div>
        </form>
      </div>

      <!-- Location List -->
      <div id="location-list" class="location-list"></div>
    </div>
  </div>

  <!-- Calibration Overlay -->
  <div id="calibration-overlay" class="overlay" style="display: none;">
    <div class="cal-panel">
      <h2>Compass Calibration</h2>
      <p class="cal-instruction">Select a visible location, point phone at it, tap Calibrate</p>

      <div class="cal-field">
        <label>Visible Location:</label>
        <select id="cal-location-select"></select>
      </div>

      <div class="cal-status">
        <div class="cal-status-item">
          <span class="cal-label">Compass</span>
          <span id="cal-compass" class="cal-value">—</span>
        </div>
        <div class="cal-status-item">
          <span class="cal-label">True Bearing</span>
          <span id="cal-bearing" class="cal-value">—</span>
        </div>
        <div class="cal-status-item">
          <span class="cal-label">GPS</span>
          <span id="cal-gps" class="cal-value">Waiting...</span>
        </div>
      </div>

      <div id="cal-result" class="cal-result" style="display: none;"></div>

      <div class="cal-buttons">
        <button id="cal-cancel-btn" class="cal-btn cancel">Cancel</button>
        <button id="cal-calibrate-btn" class="cal-btn primary">Calibrate Now</button>
      </div>

      <button id="cal-close-btn" class="cal-close">×</button>
    </div>
  </div>

  <!-- Main app module -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
