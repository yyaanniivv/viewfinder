<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Horizon">
  <meta name="description" content="See locations on the horizon through camera">
  <title>Horizon Overlook — Simple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Version indicator -->
  <div style="position: fixed; top: 8px; right: 8px; z-index: 9999; background: rgba(78,205,196,0.9); color: #000; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;">SIMPLE v1</div>
  <!-- Camera feed -->
  <video id="camera" autoplay playsinline muted style="display: none;"></video>

  <!-- Canvas overlay for markers -->
  <canvas id="overlay" aria-label="Horizon markers overlay" style="display: none;"></canvas>

  <!-- Debug pane (bottom right) -->
  <!-- Moved to bottom-panels container -->

  <!-- Top bar: Current Location + Status + Camera Toggle -->
  <div class="top-bar">
    <button id="current-location-btn" class="compass-btn" aria-label="Current location settings">
      <canvas id="compass-canvas" width="200" height="200"></canvas>
    </button>

    <div class="status-indicators">
      <div id="status-gps" class="warn">📍 GPS: —</div>
    </div>

    <button id="camera-toggle-btn" class="camera-toggle-btn off" aria-label="Toggle camera feed" title="Turn on camera">
      📷
    </button>
  </div>

  <!-- Current Location Overlay (triggered by top-left button) -->
  <div id="current-location-overlay" class="overlay" style="display: none;">
    <div class="picker-panel">
      <div class="picker-header">
        <h2>Current Location</h2>
        <button id="current-location-close-btn" class="picker-close" aria-label="Close">×</button>
      </div>

      <!-- Live GPS Status -->
      <div id="current-gps-status" class="current-gps-status">
        <div class="gps-stat">
          <span class="gps-stat-label">Latitude</span>
          <span id="gps-lat" class="gps-stat-value">—</span>
        </div>
        <div class="gps-stat">
          <span class="gps-stat-label">Longitude</span>
          <span id="gps-lon" class="gps-stat-value">—</span>
        </div>
        <div class="gps-stat">
          <span class="gps-stat-label">Altitude</span>
          <span id="gps-alt" class="gps-stat-value">—</span>
        </div>
        <div class="gps-stat">
          <span class="gps-stat-label">Accuracy</span>
          <span id="gps-acc" class="gps-stat-value">—</span>
        </div>
        <div class="gps-stat">
          <span class="gps-stat-label">Compass</span>
          <span id="gps-compass" class="gps-stat-value">—</span>
        </div>
      </div>

      <!-- Manual Override Section -->
      <div class="picker-field">
        <label>Manual Override (when GPS is off or inaccurate):</label>
        <div class="manual-coords">
          <div class="manual-field">
            <label>Lat</label>
            <input type="number" step="0.000001" id="manual-lat" placeholder="32.068444">
          </div>
          <div class="manual-field">
            <label>Lon</label>
            <input type="number" step="0.000001" id="manual-lon" placeholder="34.784437">
          </div>
        </div>
        <div class="manual-field">
          <label>Altitude (m)</label>
          <input type="number" id="manual-alt" placeholder="Optional">
        </div>
      </div>

      <div class="picker-actions">
        <button id="current-location-use-gps-btn" class="picker-btn secondary">Use GPS</button>
        <button id="current-location-set-manual-btn" class="picker-btn primary">Set Manual Location</button>
      </div>
    </div>
  </div>

  <!-- Generic Location Picker Overlay (reused for Add Location) -->
  <div id="location-picker-overlay" class="overlay" style="display: none;">
    <div class="picker-panel">
      <div class="picker-header">
        <h2 id="location-picker-title">Select Location</h2>
        <button id="location-picker-close-btn" class="picker-close" aria-label="Close">×</button>
      </div>
      <p class="picker-instruction" id="location-picker-instruction">Select a location</p>

      <div class="picker-field">
        <label for="location-picker-select">Location:</label>
        <select id="location-picker-select"></select>
      </div>

      <div id="location-picker-selected-info" class="picker-selected-info" style="display: none;"></div>

      <div class="picker-actions">
        <button id="location-picker-select-btn" class="picker-btn primary">Select</button>
        <button id="location-picker-cancel-btn" class="picker-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Bottom Panels Container (stacked vertically: locations on top, debug below) -->
  <div id="bottom-panels">
    <!-- Locations Panel (top) -->
    <div id="locations-panel" class="panel" data-state="minimized">
      <div class="panel-header">
        <h3>Locations (<span id="location-count">0</span>)</h3>
        <div class="panel-controls">
          <button id="minimize-locations-btn" class="control-btn" aria-label="Minimize locations panel" title="Minimize" style="display: none;">−</button>
          <button id="maximize-locations-btn" class="control-btn" aria-label="Maximize locations panel" title="Maximize">□</button>
          <button id="add-location-btn" class="add-btn">+ Add</button>
        </div>
      </div>

      <div class="panel-content">
        <!-- Location Form -->
        <div id="location-form-container" class="form-container" style="display: none;">
          <form id="location-form">
            <div class="field">
              <label>Name</label>
              <input type="text" id="loc-name" placeholder="Location name" required>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Latitude</label>
                <input type="number" step="0.000001" id="loc-lat" placeholder="32.068444" required>
              </div>
              <div class="field">
                <label>Longitude</label>
                <input type="number" step="0.000001" id="loc-lon" placeholder="34.784437" required>
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Altitude (m)</label>
                <input type="number" id="loc-alt" placeholder="Optional">
              </div>
              <div class="field">
                <label>Type</label>
                <select id="loc-type">
                  <option value="building">Building</option>
                  <option value="landmark">Landmark</option>
                  <option value="poi">Point of Interest</option>
                  <option value="custom">Custom</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label>Color</label>
              <select id="loc-color"></select>
            </div>
            <div class="form-actions">
              <button type="button" id="loc-cancel-btn" class="cancel-btn">Cancel</button>
              <button type="submit" class="save-btn">Save</button>
            </div>
          </form>
        </div>

        <!-- Location List -->
        <div id="location-list" class="location-list"></div>
      </div>
    </div>

    <!-- Debug Pane (bottom) - same style as locations panel -->
    <div id="debug-pane" class="panel debug-pane" data-state="minimized">
      <div class="panel-header">
        <h3>Debug</h3>
        <div class="panel-controls debug-controls">
          <button id="minimize-debug-btn" class="control-btn" aria-label="Minimize debug pane" title="Minimize" style="display: none;">−</button>
          <button id="maximize-debug-btn" class="control-btn" aria-label="Maximize debug pane" title="Maximize">□</button>
          <button id="clear-debug-btn" class="control-btn" aria-label="Clear debug log" title="Clear">🗑</button>
        </div>
      </div>
      <div id="debug-content" class="debug-content panel-content"></div>
    </div>
  </div>

  <!-- Main app module -->
  <script type="module" src="src/app2.js"></script>
</body>
</html>
