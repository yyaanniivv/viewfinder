<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Horizon">
  <meta name="description" content="See locations on the horizon through camera">
  <title>Horizon Overlook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Camera feed -->
  <video id="camera" autoplay playsinline muted style="display: none;"></video>

  <!-- Canvas overlay for markers -->
  <canvas id="overlay" aria-label="Horizon markers overlay" style="display: none;"></canvas>

  <!-- Top bar: Compass + Bearing + Status + Settings -->
  <div class="top-bar">
    <button id="compass-btn" class="compass-btn" aria-label="Tap to calibrate compass">
      <canvas id="compass-canvas" width="200" height="200"></canvas>
    </button>

    <!-- Bearing display - shows current heading -->
    <div id="bearing-display" class="bearing-display" aria-label="Current heading" title="Click to copy heading">
      <span id="bearing-cardinal" class="bearing-cardinal">—</span>
      <span id="bearing-degrees" class="bearing-degrees">—°</span>
    </div>

    <div class="status-indicators">
      <div id="status-gps" class="warn" title="Click to copy coordinates">📍 GPS: —</div>
      <div id="status-compass" class="warn">🧭 Relative</div>
    </div>

    <button id="settings-btn" class="settings-btn" aria-label="Settings" title="Settings">⚙️</button>
  </div>

  <!-- Settings Overlay -->
  <div id="settings-overlay" class="overlay" style="display: none;">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="settings-close-btn" class="settings-close" aria-label="Close">×</button>
      </div>

      <div class="settings-section">
        <h3>Camera</h3>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="camera-enabled" checked>
            <span>Camera Enabled</span>
          </label>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="camera-default-on">
            <span>Start Camera Automatically</span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <h3>GPS</h3>
        <div class="setting-row">
          <label for="gps-refresh-rate">Refresh Rate</label>
          <div class="slider-container">
            <input type="range" id="gps-refresh-rate" min="200" max="20000" step="100" value="1000">
            <span id="gps-refresh-rate-value">1s</span>
          </div>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="gps-high-accuracy" checked>
            <span>High Accuracy</span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <h3>Display</h3>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="show-bearing" checked>
            <span>Show Bearing Display</span>
          </label>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="show-level-indicator">
            <span>Show Phone Level Indicator</span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <h3>About</h3>
        <div class="setting-row">
          <span>Version</span>
          <span id="settings-version" style="font-family: ui-monospace, SFMono-Regular, monospace; color: var(--text-dim);">v1.0.0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Level Indicator Overlay (shows when phone is raised) -->
  <div id="level-indicator" class="level-indicator" style="display: none;">
    <div class="level-bar">
      <div class="level-bubble"></div>
    </div>
    <div class="level-labels">
      <span class="level-label pitch">Pitch: <span id="level-pitch">0°</span></span>
      <span class="level-label roll">Roll: <span id="level-roll">0°</span></span>
    </div>
  </div>

  <!-- Bottom: Locations Panel -->
  <div id="locations-panel" class="panel">
    <div class="panel-header">
      <h3>Locations (<span id="location-count">0</span>)</h3>
      <button id="add-location-btn" class="add-btn">+ Add</button>
    </div>

    <!-- Location Form -->
    <div id="location-form-container" class="form-container" style="display: none;">
      <form id="location-form">
        <div class="field">
          <label>Name</label>
          <input type="text" id="loc-name" placeholder="Location name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Latitude</label>
            <input type="number" step="0.000001" id="loc-lat" placeholder="32.068444" required>
          </div>
          <div class="field">
            <label>Longitude</label>
            <input type="number" step="0.000001" id="loc-lon" placeholder="34.784437" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Altitude (m)</label>
            <input type="number" id="loc-alt" placeholder="Optional">
          </div>
          <div class="field">
            <label>Type</label>
            <select id="loc-type">
              <option value="building">Building</option>
              <option value="landmark">Landmark</option>
              <option value="poi">Point of Interest</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Color</label>
          <select id="loc-color"></select>
        </div>
        <div class="field">
          <label>Paste from Clipboard</label>
          <button type="button" id="loc-paste-btn" class="paste-btn">📋 Paste Location</button>
        </div>
        <div class="form-actions">
          <button type="button" id="loc-cancel-btn" class="cancel-btn">Cancel</button>
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>
    </div>

    <!-- Location List -->
    <div id="location-list" class="location-list"></div>
  </div>

  <!-- Calibration Overlay -->
  <div id="calibration-overlay" class="overlay" style="display: none;">
    <div class="cal-panel">
      <h2>Compass Calibration</h2>
      <p class="cal-instruction">Select a visible location, point phone at it, tap Calibrate</p>

      <div class="cal-field">
        <label>Visible Location:</label>
        <select id="cal-location-select"></select>
      </div>

      <div class="cal-status">
        <div class="cal-status-item">
          <span class="cal-label">Compass</span>
          <span id="cal-compass" class="cal-value">—</span>
        </div>
        <div class="cal-status-item">
          <span class="cal-label">True Bearing</span>
          <span id="cal-bearing" class="cal-value">—</span>
        </div>
        <div class="cal-status-item">
          <span class="cal-label">GPS</span>
          <span id="cal-gps" class="cal-value">Waiting...</span>
        </div>
      </div>

      <div id="cal-result" class="cal-result" style="display: none;"></div>

      <div class="cal-buttons">
        <button id="cal-cancel-btn" class="cal-btn cancel">Cancel</button>
        <button id="cal-calibrate-btn" class="cal-btn primary">Calibrate Now</button>
      </div>

      <button id="cal-close-btn" class="cal-close">×</button>
    </div>
  </div>

  <!-- Main app module -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
